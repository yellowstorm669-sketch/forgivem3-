
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install pygame pyinstaller

      - name: Prepare audio
        shell: pwsh
        run: |
          Copy-Item "v24044gl0000d038unnog65k9tpbfmb0.mp3" "love_you.mp3"

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --add-data "love_you.mp3;." --name Forgivem3 main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Forgivem3-Windows
          path: dist/Forgivem3.exe
